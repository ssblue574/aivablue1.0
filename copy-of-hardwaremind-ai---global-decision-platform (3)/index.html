<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00FFC6" />
    <meta name="description" content="AI-powered global decision platform for hardware products" />
    <link rel="manifest" href="/manifest.json" />
    <title>Aiva · Global AI Hardware Platform</title>
    <!-- Elegant Chinese Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <!--
      Do NOT put react/react-dom in an importmap while using Vite + node_modules.
      Dual React copies cause: Cannot read properties of null (reading 'useContext').
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.59/build/spline-viewer.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
                950: '#082f49',
              },
              dark: {
                bg: '#000000',
                panel: '#161617',
                soft: '#1d1d1f',
                border: 'rgba(255,255,255,0.1)'
              }
            },
            fontFamily: {
              sans: ['SF Pro Display', 'SF Pro Text', 'Inter', 'system-ui', 'sans-serif'],
            },
            animation: {
              'logo-float': 'logoFloat 3s ease-in-out infinite',
              'fade-in': 'fadeIn 0.6s ease-out forwards',
              'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
            },
            keyframes: {
              logoFloat: {
                '0%, 100%': { transform: 'translateY(0px)', filter: 'brightness(1) drop-shadow(0 0 20px rgba(102,126,234,0.3))' },
                '50%': { transform: 'translateY(-10px)', filter: 'brightness(1.2) drop-shadow(0 0 30px rgba(118,75,162,0.6))' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              pulseGlow: {
                '0%, 100%': { opacity: '0.5', transform: 'scale(1)' },
                '50%': { opacity: '1', transform: 'scale(1.1)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #000000;
        color: #f5f5f7;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #000000;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      
      .gradient-text {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      /* Hide Spline Logo if possible via CSS (often requires paid plan, but we can try clipping) */
      spline-viewer {
        width: 100%;
        height: 100%;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
